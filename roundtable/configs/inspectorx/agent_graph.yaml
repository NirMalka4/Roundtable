- key: Dossier_ExploitEngineer
  agent_id: dossier_exploit_engineer
  display_name: "Exploit Engineer Dossier"
  kind: reducer
  code_fn: consolidate
  consolidation:
    extract: specialist_findings
    adjacency_gap: 10
    render:
      preamble: >-
        The specialist findings below are grouped by code location into concerns.
        Reference any finding by its canonical `agent::finding_id`. The Count Checksum
        is the deterministic zero-drop source of truth — account for every finding.
      empty_note: '_No specialist findings in scope._'
      group_prefix: C
      item_singular: finding
      group_plural_label: Concerns
      item_plural_label: Findings
      depth: index+appendix
  emoji: 🧨
  edges:
  - {from: Security, required: false}
  - {from: AttackSurfaceScanner, required: false}
  - {from: Analyst_Patterns, required: false}
  - {from: Analyst_Logic, required: false}
  - {from: Analyst_Standards, required: false}
  - {from: CodeCorrectness, required: false}
  - {from: Deadlock, required: false}
  - {from: Privacy, required: false}
  - {from: Architecture, required: false}
  delivery_label: '## exploit_dossier'
