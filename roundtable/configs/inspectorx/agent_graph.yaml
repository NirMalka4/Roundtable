# agent_graph.yaml — SINGLE SOURCE OF TRUTH for the InspectorX agent graph
# Python-owned so it survives prompt-bundle re-vendoring. Deps/roles live
# HERE; only the prompt body lives in the vendored .agent.md files.
# Adding an agent = append an entry here + ensure
# its .agent.md exists; run `roundtable doctor` to validate.

# Config self-identifier — the name under which this graph is loaded
# (config.graph_config.get_configuration). Absent ⇒ 'inspectorx'. This config is
# one named instance; the loader is name-addressable so more can be added.
name: inspectorx
domain_values:
  schema: _shared/vocabulary.schema.yaml
publishing:
  default_min_severity: medium

# Product identity the ADO sink stamps on user-facing surfaces (the verdict.md
# header/footer and the PR-comment attribution). The ENGINE (Roundtable) owns
# operational logs, the CLI, and the home dir; the BUNDLE owns the review PRODUCT
# name. Absent ⇒ the engine name — a config with no branding speaks as the engine.
branding:
  product_name: InspectorX
  product_emoji: 🕵️
  report_title: Deep Compute Review

# Graph-execution strategy (resolved by orchestration.executor.get_executor).
# 'dag' = the static acyclic scheduler. Absent ⇒ 'dag'.
executor: dag

# Post-graph output sink (resolved by output.sink.get_sink). 'azure_devops' =
# publish findings to the reviewed ADO PR. Absent ⇒ 'azure_devops'.
sink: azure_devops

# Result-contract: how many out-degree-0 (sink) nodes the runnable graph is
# expected to have (doctor Layer-11). 'one' = a single domain result read
# unambiguously by topology (review's contract). This is NOT an executor law —
# the engine's sinks() has no cardinality opinion — so the opinion lives HERE.
# Absent ⇒ 'one'.
sink_cardinality: one

# Post-graph publish projector (resolved by output.projector.get_projector). Maps
# THIS graph's output onto the neutral publish contract. There is no generic
# default — the coupling to InspectorX's Judge/verdict_overlay shape lives HERE, in
# the config, not in generic code. Absent ⇒ the config cannot publish.
projector: verdict_overlay

# Session-report renderer (resolved by output.report.get_report). Turns THIS
# graph's output into the human verdict.md. Independent of `sink:` — every run
# writes a report, publishing is optional. Absent/null => the slim verdict stub.
report: verdict_overlay

# Bundle plugin modules (imported by config.graph_config.register_config_plugins).
# Each populates the generic engine registries (context.enrichers /
# context.extractors) with THIS config's DOMAIN built-ins — the deterministic
# enrichers (pre-scan, security focus pack, verdict result) and the consolidation
# extract seam (specialist findings). The generic context package ships no built-in
# seam; the coupling to review's shape lives HERE, in the bundle. Absent ⇒ none.
plugins:
- roundtable.configs.inspectorx.plugins.context_plugins
- roundtable.configs.inspectorx.plugins.gates
- roundtable.configs.inspectorx.plugins.projector
- roundtable.configs.inspectorx.plugins.report


