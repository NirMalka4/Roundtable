  agent_id: verdict
  display_name: "Verdict"
  # Phase 3.5 output-CONTRACT sink node: moves the post-graph verdict + finding-count
  # extraction into the graph. A soft Judge edge makes it tolerant (UNKNOWN when Judge
  # is absent/degraded, mirroring compute_verdict), so it ALWAYS emits a valid domain
  # result. It is the unique out-degree-0 node of the runnable graph — the topological
  # handle `review` reads the run result from (doctor enforces exactly one such sink).
  edges:
  - {from: Judge, required: false}
  kind: code
  code_fn: inspectorx_build_verdict
  emoji: 🧾
  terminal: true
