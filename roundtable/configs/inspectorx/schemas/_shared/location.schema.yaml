# Shared: a single code location cited by a finding.
#
# `filePath` is the changed-file path (optionally `:line` / `#anchor`); the
# grounded_locations gate checks it against the review's changed files.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "_shared/location.schema.yaml"
title: Location
type: object
required: [filePath]
properties:
  filePath:
    type: string
    minLength: 1
  startLine:
    type: integer
    minimum: 0
  endLine:
    type: integer
    minimum: 0
additionalProperties: true
