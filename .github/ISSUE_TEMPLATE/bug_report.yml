name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Roundtable. Do not include secrets or private repository content.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps, with sensitive content removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Roundtable and Python versions
      placeholder: "Roundtable 1.2.3; Python 3.12.5"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant logs or platform details after removing secrets.
